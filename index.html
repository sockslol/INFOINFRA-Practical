<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Splash Zone Tickets</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="formBox">
      <p class="formHeader">Splash Zone Tickets</p>
      <p class="formP">Enter your name and age to see yoru ticket price.</p>
      <form class="splashForm">
        <label for="nameInput">Name:</label>
        <input type="text" id="nameInput" class="nameInput" />

        <label for="ageInput">Age:</label>
        <input type="number" id="ageInput" class="ageInput" />

        <button type="submit" class="submitInput" id="submitInput">
          Get My Ticket
        </button>
      </form>
      <p class="formOutput" id="formOutput"></p>
    </div>
    <script src="js/app.js"></script>
  </body>
</html>
